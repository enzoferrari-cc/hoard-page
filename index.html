<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Hoard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e0f11'/%3E%3Cpath d='M16 7l2.2 6.8H25l-5.6 4.1 2.1 6.6L16 20.6 10.5 24.5l2.1-6.6L7 13.8h6.8z' fill='%238b7cff'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #0e0f11; color: #eef0f3; }
    body { min-height: 100vh; font-family: ui-sans-serif, system-ui, sans-serif; }
    main { width: min(760px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 72px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 14px; letter-spacing: 0.04em; }
    .brand svg { display: block; }
    .tabs { display: flex; gap: 8px; }
    .tab, .ver {
      border: 1px solid #2a2d33;
      background: #16171a;
      color: #8a8f98;
      border-radius: 10px;
    }
    .tab {
      width: 42px;
      height: 34px;
      font: 12px/1 ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }
    .tab.on { color: #eef0f3; border-color: #8b7cff; box-shadow: inset 0 0 0 1px #8b7cff; }
    .tab:disabled { opacity: 0.35; cursor: default; }
    .ver {
      position: fixed;
      right: 16px;
      bottom: 14px;
      padding: 4px 8px;
      font-size: 10px;
      letter-spacing: 0.08em;
    }
    .hero { margin-top: 54px; }
    .total {
      margin: 0;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: clamp(3.2rem, 9vw, 4.8rem);
      letter-spacing: -0.04em;
      line-height: 0.95;
      font-weight: 480;
    }
    .moves { display: flex; gap: 18px; margin-top: 14px; color: #8a8f98; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
    .up { color: #8b7cff; }
    .down { color: #e36b6b; }
    .chart { margin-top: 28px; }
    .chart svg, .donut svg { width: 100%; display: block; }
    .chart svg { height: 180px; }
    .split { display: grid; grid-template-columns: 168px 1fr; gap: 28px; margin-top: 28px; align-items: start; }
    .donut { position: relative; width: 168px; height: 168px; }
    .donut svg { height: 168px; }
    .count {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 22px;
      pointer-events: none;
    }
    ul { list-style: none; margin: 0; padding: 0; }
    .sheet { width: 100%; }
    .head, li {
      display: grid;
      grid-template-columns: 14px 22px 1.4fr 0.8fr 0.8fr 1fr 52px 1.3fr;
      gap: 10px;
      align-items: center;
    }
    .head { padding: 0 0 8px; }
    .head button {
      border: 0;
      background: transparent;
      color: #8a8f98;
      font: 11px/1.2 ui-sans-serif, system-ui, sans-serif;
      text-align: right;
      padding: 0;
      cursor: pointer;
    }
    .head button.left { text-align: left; }
    .head button.on { color: #eef0f3; }
    li {
      padding: 11px 0;
      border-top: 1px solid #22242a;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 13px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      justify-self: center;
    }
    .logo { width: 22px; height: 22px; }
    .logo svg { width: 22px; height: 22px; display: block; }
    .sym { color: #eef0f3; font-family: ui-sans-serif, system-ui, sans-serif; display: block; }
    .code { color: #8a8f98; font: 10px/1.3 ui-monospace, Menlo, Consolas, monospace; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 520px; }
    .chip {
      border: 1px solid #2a2d33;
      background: #16171a;
      color: #8a8f98;
      border-radius: 999px;
      padding: 6px 10px;
      font: 12px/1 ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }
    .chip.on { color: #0e0f11; background: #8b7cff; border-color: #8b7cff; }
    .tags { display: flex; gap: 4px; flex-wrap: nowrap; justify-content: flex-end; }
    .tag {
      border: 1px solid #2a2d33;
      border-radius: 999px;
      padding: 2px 6px;
      color: #8a8f98;
      font: 10px/1.4 ui-sans-serif, system-ui, sans-serif;
    }
    .muted, .empty { color: #8a8f98; }
    .neg { color: #e36b6b; }
    .right { text-align: right; }
    .empty { margin-top: 18vh; font-size: 28px; }
    @media (max-width: 680px) {
      .split { grid-template-columns: 1fr; }
      .head, li { grid-template-columns: 14px 22px 1fr 1fr; }
      .head button:nth-child(n + 4), li span:nth-child(n + 5) { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2l1.5 4.6H14.4L10.6 8.7l1.4 4.5L8 10.4 4 13.2l1.4-4.5L1.6 5.8h4.9z" fill="#8b7cff"/></svg>
        Hoard
      </div>
      <div class="tabs" id="tabs"></div>
    </header>
    <div id="app"></div>
  </main>
  <div class="ver">v0.0.10</div>
  <script>
    (function () {
      var TABS = [
        { id: "CNY", mark: "¥" },
        { id: "HKD", mark: "HK$" },
        { id: "USD", mark: "$" }
      ];
      var state = { data: null, tab: "CNY", tags: [], sort: "value", dir: -1 };
      function palette(index) {
        return "hsl(" + Math.round((index * 137.508) % 360) + " 68% 64%)";
      }

      function decodePortfolio() {
        var raw = new URLSearchParams(location.search).get("portfolio");
        if (!raw) return null;
        raw = raw.replace(/ /g, "+").replace(/-/g, "+").replace(/_/g, "/");
        while (raw.length % 4) raw += "=";
        var bytes = Uint8Array.from(atob(raw), function (ch) { return ch.charCodeAt(0); });
        return JSON.parse(new TextDecoder().decode(bytes));
      }

      function currencyOf(row, quote) {
        if (row.ccy) return String(row.ccy).toUpperCase();
        if (quote && quote.ccy) return String(quote.ccy).toUpperCase();
        var source = typeof row.price === "string" ? row.price : "";
        if (source.indexOf("tencent:") === 0) return source.slice(8, 10).toLowerCase() === "hk" ? "HKD" : "CNY";
        if (source.indexOf("yahoo:") === 0) return source.toUpperCase().slice(-3) === ".HK" ? "HKD" : "USD";
        if (source.indexOf("okx:") === 0 && source.indexOf("-") > 0) return source.split("-").pop().toUpperCase();
        if (source.indexOf("fixed:") === 0) return (source.split(":")[2] || row.symbol || "USD").toUpperCase();
        return null;
      }

      function anchorOf(ccy) {
        if (!ccy) return null;
        ccy = ccy.toUpperCase();
        if (ccy === "USD" || ccy === "USDT" || ccy === "USDC") return "USD";
        if (ccy === "HKD" || ccy === "CNY") return ccy;
        return null;
      }

      function fixedQuote(row) {
        if (typeof row.price !== "string" || row.price.indexOf("fixed:") !== 0) return null;
        var parts = row.price.split(":");
        var price = Number(parts[1]);
        if (!isFinite(price)) return null;
        var ccy = row.ccy || parts[2];
        if (!ccy && (row.symbol === "USDC" || row.symbol === "USDT" || row.symbol === "USD")) ccy = row.symbol === "USD" ? "USD" : row.symbol;
        return { price: price, ccy: String(ccy || "USD").toUpperCase() };
      }

      function quoteFor(row, snap) {
        var fixed = fixedQuote(row);
        if (fixed) return fixed;
        if (typeof row.price === "number") return { price: row.price, ccy: currencyOf(row) };
        var book = (snap && snap.prices) || {};
        var found = book[row.symbol] || book[baseTicker(row.symbol)] || book[row.id];
        if (typeof found === "number") return { price: found, ccy: currencyOf(row) };
        if (found && typeof found.price === "number") return found;
        return null;
      }

      function baseTicker(symbol) {
        return String(symbol || "").replace(/-LOAN$/i, "");
      }

      function displayName(row) {
        return row.name || baseTicker(row.symbol);
      }

      function iconKey(row) {
        var ticker = baseTicker(row.symbol);
        var source = typeof row.price === "string" ? row.price.toLowerCase() : "";
        if (ticker === "ETH" || ticker === "BTC" || ticker === "USDC" || ticker === "USDT") return ticker;
        if (ticker.toUpperCase().slice(-3) === ".HK" || source.indexOf("tencent:hk") === 0) return "HK";
        if (/^\d{6}$/.test(ticker) || source.indexOf("tencent:sh") === 0 || source.indexOf("tencent:sz") === 0) return "A";
        return "generic";
      }

      function iconFor(row) {
        var ticker = baseTicker(row.symbol);
        var paths = {
          ETH: '<path d="M16 5l7 11-7 4-7-4z" fill="#8b7cff"/><path d="M16 27l7-11-7 4-7-4z" fill="#5b4ed1"/>',
          BTC: '<circle cx="16" cy="16" r="11" fill="#f0b429"/><path d="M14 9h4.5a2.4 2.4 0 010 4.8H14V9zm0 6.2h5.2a2.4 2.4 0 010 4.8H14v-4.8z" fill="#1c1915"/>',
          USDC: '<circle cx="16" cy="16" r="11" fill="#5aa9ff"/><circle cx="16" cy="16" r="5" fill="#0e0f11"/>',
          USDT: '<circle cx="16" cy="16" r="11" fill="#3ecfb2"/><path d="M10 13h12M16 10v12" stroke="#0e0f11" stroke-width="2"/>',
          "0700.HK": '<rect x="6" y="6" width="20" height="20" rx="6" fill="#ff7a90"/><circle cx="16" cy="16" r="5" fill="#0e0f11"/>',
          "9988.HK": '<rect x="6" y="6" width="20" height="20" rx="6" fill="#f08a5d"/><path d="M11 21l5-10 5 10" fill="none" stroke="#0e0f11" stroke-width="2"/>',
          "510300": '<rect x="6" y="6" width="20" height="20" rx="6" fill="#5aa9ff"/><path d="M10 20l4-8 3 5 5-7" fill="none" stroke="#0e0f11" stroke-width="2"/>',
          "513050": '<rect x="6" y="6" width="20" height="20" rx="6" fill="#c084fc"/><circle cx="16" cy="16" r="4" fill="#0e0f11"/>',
          "518880": '<rect x="6" y="6" width="20" height="20" rx="6" fill="#f0b429"/><circle cx="16" cy="16" r="4" fill="#0e0f11"/>'
        };
        var wrap = document.createElement("span");
        wrap.className = "av";
        if (paths[ticker]) {
          wrap.innerHTML = '<svg viewBox="0 0 32 32" aria-hidden="true">' + paths[ticker] + "</svg>";
          return wrap;
        }
        wrap.textContent = markFor(row);
        return wrap;
      }

      // Crypto icons from spothq/cryptocurrency-icons, CC0-1.0. Stocks have no icon.
      function logoFor(row) {
        var ticker = baseTicker(row.symbol).toUpperCase();
        var logos = {
          ETH: '<svg viewBox="0 0 32 32" aria-hidden="true"><g fill="none"><circle cx="16" cy="16" r="16" fill="#627EEA"/><g fill="#FFF"><path fill-opacity=".6" d="M16.5 4v8.87l7.5 3.35z"/><path d="M16.5 4L9 16.22l7.5-3.35z"/><path fill-opacity=".6" d="M16.5 21.97V28L24 17.62z"/><path d="M16.5 28v-6.03L9 17.62z"/><path fill-opacity=".2" d="M16.5 20.57l7.5-4.35-7.5-3.35z"/><path fill-opacity=".6" d="M9 16.22l7.5 4.35v-7.7z"/></g></g></svg>',
          BTC: '<svg viewBox="0 0 32 32" aria-hidden="true"><g fill="none"><circle cx="16" cy="16" r="16" fill="#F7931A"/><path fill="#FFF" d="M23.2 14c.3-2.1-1.3-3.2-3.5-4l.7-2.8-1.7-.4-.7 2.8c-.5-.1-.9-.2-1.4-.3l.7-2.8-1.7-.4-.7 2.8c-.4-.1-.7-.2-1.1-.3v0l-2.4-.6-.5 1.8s1.3.3 1.3.3c.7.2.8.6.8 1l-.8 3.2c0 0 .1 0 .2.1l-.2 0-1.1 4.5c-.1.2-.3.5-.8.4 0 0-1.3-.3-1.3-.3l-.9 2 2.3.6c.4.1.8.2 1.2.3l-.7 2.9 1.7.4.7-2.8c.5.1.9.2 1.4.4l-.7 2.8 1.7.4.7-2.9c3 .6 5.2.3 6.1-2.3.8-2.1 0-3.4-1.6-4.2 1.1-.3 2-1 2.2-2.5zm-4 5.5c-.5 2.1-4.1 1-5.3.7l.9-3.8c1.2.3 4.9.9 4.4 3.1zm.5-5.6c-.5 2-3.5 1-4.5.7l.9-3.4c1 .2 4.1.7 3.6 2.7z"/></g></svg>',
          USDC: '<svg viewBox="0 0 32 32" aria-hidden="true"><g fill="none"><circle cx="16" cy="16" r="16" fill="#3E73C4"/><path fill="#FFF" d="M20 18.1c0-2.1-1.3-2.8-3.8-3.1-1.8-.3-2.2-.7-2.2-1.6s.6-1.4 1.8-1.4c1.1 0 1.7.4 2 1.3h1.4v-.1a3 3 0 00-2.7-2.5V9.1h-1.4v1.4c-1.8.2-3 1.5-3 3 0 2 1.2 2.8 3.8 3.1 1.7.3 2.3.7 2.3 1.6s-.9 1.6-2 1.6c-1.6 0-2.1-.7-2.3-1.6h-1.5v.1c.2 1.5 1.2 2.6 3.2 2.9v1.5h1.4V21.3c1.8-.3 3-1.6 3-3.2z"/></g></svg>',
          USDT: '<svg viewBox="0 0 32 32" aria-hidden="true"><g fill="none"><circle cx="16" cy="16" r="16" fill="#26A17B"/><path fill="#FFF" d="M17.9 17.4v0c-.1 0-.7 0-1.9 0-1 0-1.7 0-2 0v0c-3.9-.2-6.8-.8-6.8-1.7s2.9-1.5 6.8-1.6v2.6c.3 0 1 .1 2 .1s1.8 0 1.9-.1v-2.6c3.9.2 6.8.8 6.8 1.6s-2.9 1.5-6.8 1.7m0-3.6V11.4h5.4V7.8H8.6v3.6h5.4v2.4c-4.4.2-7.7 1.1-7.7 2.1s3.3 1.9 7.7 2.1v7.6h3.9v-7.6c4.4-.2 7.7-1.1 7.7-2.1s-3.3-1.9-7.7-2.1"/></g></svg>'
        };
        var wrap = document.createElement("span");
        wrap.className = "logo";
        var svg = logos[baseTicker(row.symbol).toUpperCase()];
        if (svg) wrap.innerHTML = svg;
        return wrap;
      }

      function markFor(row) {
        var symbol = String(row.symbol || "");
        var source = typeof row.price === "string" ? row.price.toLowerCase() : "";
        var tags = row.tags || [];
        if (symbol.toUpperCase().slice(-3) === ".HK" || source.indexOf("tencent:hk") === 0 || tags.indexOf("港股") >= 0 || tags.indexOf("港股通") >= 0) return "HK";
        if (/^\d{6}$/.test(symbol) || source.indexOf("tencent:sh") === 0 || source.indexOf("tencent:sz") === 0 || tags.indexOf("A股") >= 0) return "A";
        return symbol.slice(0, 1) || "?";
      }

      function lineValue(row, snap) {
        if (row.qty == null || row.count === "exposure") return null;
        var quote = quoteFor(row, snap);
        var anchor = anchorOf(currencyOf(row, quote));
        if (!quote || !anchor) return null;
        return { anchor: anchor, price: quote.price, value: Number(row.qty) * quote.price };
      }

      function tagMatch(row) {
        if (!state.tags.length) return true;
        var tags = row.tags || [];
        return state.tags.every(function (tag) { return tags.indexOf(tag) >= 0; });
      }

      function rowsFor(tab, snap) {
        return (state.data.holdings || []).map(function (row) {
          var valued = lineValue(row, snap);
          if (!valued || valued.anchor !== tab || !tagMatch(row)) return null;
          return { row: row, ticker: baseTicker(row.symbol), price: valued.price, value: valued.value };
        }).filter(Boolean);
      }

      function shanghaiDate(iso) {
        return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Hong_Kong", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(iso));
      }

      function dateUtc(iso) {
        var parts = shanghaiDate(iso).split("-").map(Number);
        return Date.UTC(parts[0], parts[1] - 1, parts[2]);
      }

      function windowStart(latest, kind) {
        var parts = shanghaiDate(latest).split("-").map(Number);
        var utc = Date.UTC(parts[0], parts[1] - 1, parts[2]);
        if (kind === "week") {
          var day = new Date(utc).getUTCDay();
          return utc - (day === 0 ? 6 : day - 1) * 86400000;
        }
        return Date.UTC(parts[0], parts[1] - 1, 1);
      }

      function series(tab) {
        var expected = (state.data.holdings || []).filter(function (row) {
          if (row.qty == null || row.count === "exposure" || !tagMatch(row)) return false;
          return anchorOf(currencyOf(row, quoteFor(row, null))) === tab;
        });
        return (state.data.snapshots || []).map(function (snap) {
          if (!expected.length) return null;
          var valued = expected.map(function (row) { return lineValue(row, snap); });
          return {
            ts: snap.ts,
            total: valued.reduce(function (sum, item) { return sum + (item ? item.value : 0); }, 0),
            complete: valued.every(Boolean),
            backfill: snap.source === "backfill"
          };
        }).filter(Boolean);
      }

      function change(points, kind) {
        var complete = points.filter(function (point) { return point.complete; });
        if (complete.length < 2) return null;
        var latest = complete[complete.length - 1];
        var start = windowStart(latest.ts, kind);
        var baseline = null;
        complete.forEach(function (point) {
          if (point === latest) return;
          if (dateUtc(point.ts) <= start) baseline = point;
        });
        if (!baseline) {
          complete.some(function (point) {
            if (point === latest) return false;
            baseline = point;
            return true;
          });
        }
        if (!baseline || !baseline.total) return null;
        return (latest.total - baseline.total) / baseline.total;
      }

      function formatNum(value, digits) {
        var abs = Math.abs(value);
        var body = new Intl.NumberFormat("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits }).format(abs);
        return value < 0 ? "−" + body : body;
      }

      function formatPct(value) {
        if (value == null || !isFinite(value)) return "—";
        var arrow = value > 0 ? "↑ " : value < 0 ? "↓ " : "";
        return arrow + Math.abs(value * 100).toFixed(1) + "%";
      }

      function sortValue(item, total) {
        if (state.sort === "name") return displayName(item.row);
        if (state.sort === "qty") return Number(item.row.qty);
        if (state.sort === "price") return item.price;
        if (state.sort === "share") return total ? item.value / total : 0;
        if (state.sort === "tag") return (item.row.tags || []).join(",");
        return item.value;
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      function monotone(values, xAt, yAt) {
        var n = values.length;
        if (n < 2) return "";
        var xs = [];
        var ys = [];
        for (var i = 0; i < n; i += 1) {
          xs.push(xAt(i));
          ys.push(yAt(values[i]));
        }
        var dx = [];
        var slope = [];
        for (var s = 0; s < n - 1; s += 1) {
          dx.push(xs[s + 1] - xs[s] || 1);
          slope.push((ys[s + 1] - ys[s]) / dx[s]);
        }
        var tan = new Array(n);
        tan[0] = slope[0];
        tan[n - 1] = slope[n - 2];
        for (var j = 1; j < n - 1; j += 1) {
          tan[j] = slope[j - 1] * slope[j] <= 0 ? 0 : (slope[j - 1] + slope[j]) / 2;
        }
        for (var k = 0; k < n - 1; k += 1) {
          if (slope[k] === 0) {
            tan[k] = 0;
            tan[k + 1] = 0;
            continue;
          }
          var a = tan[k] / slope[k];
          var b = tan[k + 1] / slope[k];
          var h = a * a + b * b;
          if (h > 9) {
            var scale = 3 / Math.sqrt(h);
            tan[k] = scale * a * slope[k];
            tan[k + 1] = scale * b * slope[k];
          }
        }
        var d = "M" + xs[0].toFixed(1) + " " + ys[0].toFixed(1);
        for (var p = 0; p < n - 1; p += 1) {
          var c1x = xs[p] + dx[p] / 3;
          var c1y = ys[p] + tan[p] * dx[p] / 3;
          var c2x = xs[p + 1] - dx[p] / 3;
          var c2y = ys[p + 1] - tan[p + 1] * dx[p] / 3;
          d += " C" + c1x.toFixed(1) + " " + c1y.toFixed(1) + " " + c2x.toFixed(1) + " " + c2y.toFixed(1) + " " + xs[p + 1].toFixed(1) + " " + ys[p + 1].toFixed(1);
        }
        return d;
      }

      function drawChart(points) {
        var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 760 180");
        svg.setAttribute("role", "img");
        if (points.length < 2) return svg;
        var min = Math.min.apply(null, points.map(function (point) { return point.total; }));
        var max = Math.max.apply(null, points.map(function (point) { return point.total; }));
        if (min === max) { min -= 1; max += 1; }
        var pad = (max - min) * 0.16;
        min -= pad;
        max += pad;
        function x(i) { return 8 + (i / (points.length - 1)) * 744; }
        function y(value) { return 12 + (1 - (value - min) / (max - min)) * 150; }
        var segment = [];
        function flush() {
          if (segment.length < 2) { segment = []; return; }
          var indexes = segment.map(function (item) { return item.i; });
          var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", monotone(indexes.map(function (i) { return points[i].total; }), function (n) { return x(indexes[n]); }, y));
          path.setAttribute("fill", "none");
          path.setAttribute("stroke", "#8b7cff");
          path.setAttribute("stroke-width", "2");
          if (segment[0].backfill) path.setAttribute("stroke-dasharray", "5 4");
          svg.appendChild(path);
          segment = [];
        }
        points.forEach(function (point, i) {
          if (!point.complete) { flush(); return; }
          if (segment.length && segment[0].backfill !== point.backfill) {
            var previous = segment[segment.length - 1];
            flush();
            segment = [previous, { i: i, backfill: point.backfill }];
            return;
          }
          segment.push({ i: i, backfill: point.backfill });
        });
        flush();
        return svg;
      }

      function drawDonut(rows) {
        var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 168 168");
        var nets = {};
        var order = [];
        rows.forEach(function (item) {
          if (!nets[item.ticker]) {
            nets[item.ticker] = { ticker: item.ticker, value: 0, color: item.color };
            order.push(item.ticker);
          }
          nets[item.ticker].value += item.value;
        });
        var positives = order.map(function (key) { return nets[key]; }).filter(function (item) { return item.value > 0; });
        var sum = positives.reduce(function (total, item) { return total + item.value; }, 0);
        var start = -Math.PI / 2;
        positives.forEach(function (item, index) {
          var angle = sum ? (item.value / sum) * Math.PI * 2 : 0;
          var end = start + angle;
          var large = angle > Math.PI ? 1 : 0;
          var r = 62;
          var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          var x1 = 84 + r * Math.cos(start);
          var y1 = 84 + r * Math.sin(start);
          var x2 = 84 + r * Math.cos(end - 0.01);
          var y2 = 84 + r * Math.sin(end - 0.01);
          path.setAttribute("d", "M" + x1.toFixed(2) + " " + y1.toFixed(2) + " A" + r + " " + r + " 0 " + large + " 1 " + x2.toFixed(2) + " " + y2.toFixed(2));
          path.setAttribute("fill", "none");
          path.setAttribute("stroke", item.color || palette(index));
          path.setAttribute("stroke-width", "14");
          path.setAttribute("stroke-linecap", "butt");
          svg.appendChild(path);
          start = end;
        });
        return svg;
      }

      function availableTags() {
        var found = [];
        (state.data && state.data.holdings || []).forEach(function (row) {
          var valued = lineValue(row, latestSnap());
          if (!valued || valued.anchor !== state.tab) return;
          (row.tags || []).forEach(function (tag) {
            if (found.indexOf(tag) < 0) found.push(tag);
          });
        });
        return found;
      }

      function renderFilters() {
        var host = document.getElementById("tabs");
        host.className = "filters";
        host.textContent = "";
        TABS.forEach(function (tab) {
          var button = el("button", "chip" + (state.tab === tab.id ? " on" : ""), tab.id);
          button.type = "button";
          button.addEventListener("click", function () {
            state.tab = tab.id;
            var known = availableTags();
            state.tags = state.tags.filter(function (tag) { return known.indexOf(tag) >= 0; });
            render();
          });
          host.appendChild(button);
        });
        availableTags().forEach(function (tag, index) {
          var on = state.tags.indexOf(tag) >= 0;
          var button = el("button", "chip" + (on ? " on" : ""), tag);
          button.type = "button";
          button.style.borderColor = palette(index + 3);
          if (on) {
            button.style.background = palette(index + 3);
            button.style.color = "#0e0f11";
          }
          button.addEventListener("click", function () {
            var at = state.tags.indexOf(tag);
            if (at >= 0) state.tags.splice(at, 1);
            else state.tags.push(tag);
            render();
          });
          host.appendChild(button);
        });
      }

      function latestSnap() {
        var snaps = (state.data && state.data.snapshots) || [];
        return snaps.length ? snaps[snaps.length - 1] : null;
      }

      function render() {
        var app = document.getElementById("app");
        app.textContent = "";
        renderFilters();
        if (!state.data) {
          app.appendChild(el("p", "empty", "—"));
          return;
        }
        var latest = latestSnap();
        var rows = rowsFor(state.tab, latest);
        var tickers = [];
        rows.forEach(function (item) {
          if (tickers.indexOf(item.ticker) < 0) tickers.push(item.ticker);
          item.color = palette(tickers.indexOf(item.ticker));
        });
        if (!rows.length) {
          app.appendChild(el("p", "empty", "—"));
          return;
        }
        var total = rows.reduce(function (sum, item) { return sum + item.value; }, 0);
        var points = series(state.tab);
        var hero = el("section", "hero");
        var figure = el("p", "total" + (total < 0 ? " neg" : ""), formatNum(total, Math.abs(total) >= 100 || total === 0 ? 0 : 2) + " " + state.tab);
        hero.appendChild(figure);
        var moves = el("div", "moves");
        [["W", change(points, "week")], ["M", change(points, "month")]].forEach(function (item) {
          var node = el("span", item[1] > 0 ? "up" : item[1] < 0 ? "down" : "", item[0] + " " + formatPct(item[1]));
          moves.appendChild(node);
        });
        hero.appendChild(moves);
        app.appendChild(hero);
        var chart = el("section", "chart");
        chart.appendChild(drawChart(points));
        app.appendChild(chart);
        var split = el("section", "split");
        var donut = el("div", "donut");
        donut.appendChild(drawDonut(rows));
        var tickerCount = rows.reduce(function (list, item) { if (list.indexOf(item.ticker) < 0) list.push(item.ticker); return list; }, []).length;
        donut.appendChild(el("div", "count", String(tickerCount)));
        split.appendChild(donut);
        var sheet = el("div", "sheet");
        var head = el("div", "head");
        head.appendChild(el("span", ""));
        head.appendChild(el("span", ""));
        [["name", "Asset", "left"], ["qty", "Qty", ""], ["price", "Price", ""], ["value", "Value", ""], ["share", "%", ""], ["tag", "Tags", ""]].forEach(function (col) {
          var button = el("button", (col[2] ? col[2] + " " : "") + (state.sort === col[0] ? "on" : ""), col[1] + (state.sort === col[0] ? (state.dir < 0 ? " ↓" : " ↑") : ""));
          button.type = "button";
          button.addEventListener("click", function () {
            state.dir = state.sort === col[0] ? -state.dir : (col[0] === "name" || col[0] === "tag" ? 1 : -1);
            state.sort = col[0];
            render();
          });
          head.appendChild(button);
        });
        sheet.appendChild(head);
        var list = document.createElement("ul");
        rows.slice().sort(function (a, b) {
          var av = sortValue(a, total);
          var bv = sortValue(b, total);
          if (typeof av === "string") return av.localeCompare(bv) * state.dir;
          return (av - bv) * state.dir;
        }).forEach(function (item) {
          var li = document.createElement("li");
          var dot = el("span", "dot");
          dot.style.background = item.color;
          li.appendChild(dot);
          li.appendChild(logoFor(item.row));
          var name = el("span", "name");
          name.appendChild(el("span", "sym", displayName(item.row)));
          name.appendChild(el("span", "code", baseTicker(item.row.symbol)));
          li.appendChild(name);
          li.appendChild(el("span", "right" + (item.row.qty < 0 ? " neg" : ""), new Intl.NumberFormat("en-US", { maximumFractionDigits: 4 }).format(item.row.qty).replace("-", "−")));
          li.appendChild(el("span", "right muted", formatNum(item.price, item.price >= 100 ? 0 : 2)));
          li.appendChild(el("span", "right" + (item.value < 0 ? " neg" : ""), formatNum(item.value, Math.abs(item.value) >= 100 ? 0 : 2)));
          var share = total ? item.value / total : null;
          li.appendChild(el("span", "right muted", share == null ? "—" : (share * 100).toFixed(0) + "%"));
          var tags = el("span", "tags");
          (item.row.tags || []).forEach(function (tag) { tags.appendChild(el("span", "tag", tag)); });
          li.appendChild(tags);
          list.appendChild(li);
        });
        sheet.appendChild(list);
        split.appendChild(sheet);
        app.appendChild(split);
      }

      try { state.data = decodePortfolio(); } catch (error) { state.data = null; }
      var requested = (new URLSearchParams(location.search).get("tab") || "").toLowerCase();
      var tabFromUrl = { cny: "CNY", hkd: "HKD", usd: "USD" }[requested];
      state.tab = tabFromUrl || "CNY";
      render();
    })();
  </script>
</body>
