    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #0e0f11; color: #eef0f3; }
    body { min-height: 100vh; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    main { width: min(760px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 72px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 14px; letter-spacing: 0.04em; }
    .brand svg { display: block; }
    .tabs { display: flex; gap: 8px; }
    .tab, .ver {
      border: 1px solid #2a2d33;
      background: #16171a;
      color: #8a8f98;
      border-radius: 10px;
    }
    .tab {
      width: 42px;
      height: 34px;
      font: 12px/1 ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }
    .tab.on { color: #eef0f3; border-color: #8b7cff; box-shadow: inset 0 0 0 1px #8b7cff; }
    .tab:disabled { opacity: 0.35; cursor: default; }
    .ver {
      position: fixed;
      right: 16px;
      bottom: 14px;
      padding: 4px 8px;
      font-size: 10px;
      letter-spacing: 0.08em;
    }
    .stale {
      position: fixed;
      right: 16px;
      bottom: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      font-size: 11px;
      border: 1px solid #2a2d33;
      border-radius: 6px;
      background: #16171a;
      color: #eef0f3;
    }
    .stale[hidden] { display: none; }
    .stale button {
      border: 1px solid #2a2d33;
      background: #1e2024;
      color: #eef0f3;
      font: inherit;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .hero { margin-top: 54px; }
    .total {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(3.2rem, 9vw, 4.8rem);
      letter-spacing: -0.04em;
      line-height: 0.95;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
    }
    .total-line { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    .ccys { display: flex; gap: 10px; }
    .ccy-switch {
      border: 0;
      background: transparent;
      color: #8a8f98;
      font: 500 14px/1 Inter, ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
      padding: 0;
    }
    .ccy-switch.on { color: #eef0f3; }

    .active { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .ranges { display: flex; gap: 12px; align-items: center; margin-top: 14px; color: #8a8f98; font-size: 13px; font-variant-numeric: tabular-nums; }
    .range { border: 0; background: transparent; color: #8a8f98; font: 500 13px/1 Inter, ui-sans-serif, system-ui, sans-serif; padding: 0; cursor: pointer; }
    .range.on { color: #eef0f3; }
    .up { color: #8b7cff; }
    .down { color: #e36b6b; }
    .chart { margin-top: 28px; height: 220px; position: relative; }
    .chart canvas { width: 100% !important; height: 220px !important; display: block; }
    .chart svg, .donut svg { width: 100%; display: block; }
    .split { display: grid; grid-template-columns: 168px 1fr; gap: 28px; margin-top: 28px; align-items: start; }
    .donut { position: relative; width: 168px; height: 168px; }
    .donut svg { height: 168px; }
    .count {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    ul { list-style: none; margin: 0; padding: 0; }
    table.sheet { width: 100%; table-layout: fixed; border-collapse: collapse; }
    .head th, td { vertical-align: middle; }
    .head th { padding: 0 10px 8px 0; }
    td { padding: 11px 10px 11px 0; border-top: 1px solid #22242a; }
    tr.focus { background: rgba(139, 124, 255, 0.08); }
    tr.child td:first-child { padding-left: 28px; }
    .head button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #8a8f98;
      font: 11px/1.2 ui-sans-serif, system-ui, sans-serif;
      text-align: right;
      padding: 0;
      cursor: pointer;
    }
    .head button.left { text-align: left; }
    .head button.on { color: #eef0f3; }
    table.sheet { font-size: 13px; font-variant-numeric: tabular-nums; }
    .logo { width: 22px; height: 22px; flex: 0 0 22px; }
    .logo.blank { visibility: hidden; }
    .logo img, .logo svg { width: 22px; height: 22px; display: block; }
    .name { display: flex; align-items: center; gap: 8px; }
    .name button.expander {
      border: 0;
      background: transparent;
      color: #eef0f3;
      font: inherit;
      padding: 0;
      cursor: pointer;
    }
    .name-text { display: block; min-width: 0; }
    .sym { color: #eef0f3; font-family: Inter, ui-sans-serif, system-ui, sans-serif; display: block; }
    .code { color: #8a8f98; font: 10px/1.3 Inter, ui-sans-serif, system-ui, sans-serif; display: block; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 520px; }
    .chip {
      border: 1px solid #2a2d33;
      background: #16171a;
      color: #8a8f98;
      border-radius: 999px;
      padding: 6px 10px;
      font: 12px/1 ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }
    .chip.on { color: #0e0f11; background: #8b7cff; border-color: #8b7cff; }
    .tags, .active { display: flex; gap: 4px; flex-wrap: nowrap; justify-content: flex-end; min-width: 0; }
    .more { position: relative; }
    .more .all {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      z-index: 3;
      width: max-content;
      max-width: 240px;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 4px;
      padding: 6px;
      background: #16171a;
      border: 1px solid #2a2d33;
      border-radius: 8px;
    }
    .more:hover .all, .more:focus-within .all { display: flex; }
    .active { flex-wrap: wrap; justify-content: flex-start; margin-top: 14px; }
    .tag, .active .chip {
      border: 0;
      border-radius: 4px;
      padding: 2px 6px;
      font: 500 11px/1.4 Inter, ui-sans-serif, system-ui, sans-serif;

      function drawDonut(rows) {
        var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 168 168");
        var nets = {};
        var order = [];
        rows.forEach(function (item) {
          if (!nets[item.ticker]) {
            nets[item.ticker] = { ticker: item.ticker, value: 0, color: item.color };
            order.push(item.ticker);
          }
          nets[item.ticker].value += item.value;
        });
        var positives = order.map(function (key) { return nets[key]; }).filter(function (item) { return item.value > 0; });
        var sum = positives.reduce(function (total, item) { return total + item.value; }, 0);
        var start = -Math.PI / 2;
        positives.forEach(function (item, index) {
          var angle = sum ? (item.value / sum) * Math.PI * 2 : 0;
          var end = start + angle;
          var large = angle > Math.PI ? 1 : 0;
          var r = 62;
          var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          var x1 = 84 + r * Math.cos(start);
          var y1 = 84 + r * Math.sin(start);
          var x2 = 84 + r * Math.cos(end - 0.01);
          var y2 = 84 + r * Math.sin(end - 0.01);
          path.setAttribute("d", "M" + x1.toFixed(2) + " " + y1.toFixed(2) + " A" + r + " " + r + " 0 " + large + " 1 " + x2.toFixed(2) + " " + y2.toFixed(2));
          path.setAttribute("fill", "none");
          path.setAttribute("stroke", item.color || palette(index));
          path.setAttribute("stroke-width", "14");
          path.setAttribute("stroke-linecap", "butt");
          svg.appendChild(path);
          start = end;
        });
        return svg;
      }

      function loadRemote() {
        var headers = { apikey: remoteConfig.publishableKey, Authorization: "Bearer " + remoteConfig.publishableKey };
        var root = remoteConfig.url.replace(/\/$/, "");
        var holdingsPath = remoteConfig.holdingsPath || "/rest/v1/holdings?select=*";
        var snapshotsPath = remoteConfig.snapshotsPath || "/rest/v1/snapshots?select=*&order=ts.asc";
        Promise.all([
          fetch(root + holdingsPath, { headers: headers }),
          fetch(root + snapshotsPath, { headers: headers })
        ]).then(function (responses) {
          if (responses.some(function (res) { return !res.ok; })) throw new Error("read");
          return Promise.all(responses.map(function (res) { return res.json(); }));
        }).then(function (parts) {
          state.data = { holdings: parts[0] || [], snapshots: parts[1] || [] };
          state.notice = "";
          render();
        }).catch(function () {
          state.data = null;
          state.notice = "读取失败";
          render();
        });
      }
    })();
  </script>
</body>
</html>
