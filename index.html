    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #0e0f11; color: #eef0f3; }
    body { min-height: 100vh; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    main { width: min(760px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 72px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 14px; letter-spacing: 0.04em; }
    .brand svg { display: block; }
    .tabs { display: flex; gap: 8px; }
    .tab, .ver {
      border: 1px solid #2a2d33;
      background: #16171a;
      color: #8a8f98;
      border-radius: 10px;
    }
    .tab {
      width: 42px;
      height: 34px;
      font: 12px/1 ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }
    .tab.on { color: #eef0f3; border-color: #8b7cff; box-shadow: inset 0 0 0 1px #8b7cff; }
    .tab:disabled { opacity: 0.35; cursor: default; }
    .ver {
      position: fixed;
      right: 16px;
      bottom: 14px;
      padding: 4px 8px;
      font-size: 10px;
      letter-spacing: 0.08em;
    }
    .hero { margin-top: 54px; }
    .total {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(3.2rem, 9vw, 4.8rem);
      letter-spacing: -0.04em;
      line-height: 0.95;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
    }
    .total-line { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    .ccys { display: flex; gap: 10px; }
    .ccy-switch {
      border: 0;
      background: transparent;
      color: #8a8f98;
      font: 500 14px/1 Inter, ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
      padding: 0;
    }
    .ccy-switch.on { color: #eef0f3; }
    li.child { padding-left: 28px; }
    .active { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .ranges { display: flex; gap: 12px; align-items: center; margin-top: 14px; color: #8a8f98; font-size: 13px; font-variant-numeric: tabular-nums; }
    .range { border: 0; background: transparent; color: #8a8f98; font: 500 13px/1 Inter, ui-sans-serif, system-ui, sans-serif; padding: 0; cursor: pointer; }
    .range.on { color: #eef0f3; }
    .up { color: #8b7cff; }
    .down { color: #e36b6b; }
    .chart { margin-top: 28px; }
    .chart svg, .donut svg { width: 100%; display: block; }
    .chart svg { height: 180px; }
    .split { display: grid; grid-template-columns: 168px 1fr; gap: 28px; margin-top: 28px; align-items: start; }
    .donut { position: relative; width: 168px; height: 168px; }
    .donut svg { height: 168px; }
    .count {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    ul { list-style: none; margin: 0; padding: 0; }
    .sheet { width: 100%; }
    .head, li {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr 0.8fr 1fr 1.3fr;
      gap: 10px;
      align-items: center;
    }
    .head { padding: 0 0 8px; }
    .head button {
      border: 0;
      background: transparent;
      color: #8a8f98;
      font: 11px/1.2 ui-sans-serif, system-ui, sans-serif;
      text-align: right;
      padding: 0;
      cursor: pointer;
    }
    .head button.left { text-align: left; }
    .head button.on { color: #eef0f3; }
    li {
      padding: 11px 0;
      border-top: 1px solid #22242a;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .logo { width: 22px; height: 22px; }
    .logo svg { width: 22px; height: 22px; display: block; }
    .name { display: flex; align-items: center; gap: 8px; }
    .name button.expander {
      border: 0;
      background: transparent;
      color: #eef0f3;
      font: inherit;
      padding: 0;
      cursor: pointer;
    }
    .sym { color: #eef0f3; font-family: Inter, ui-sans-serif, system-ui, sans-serif; display: block; }
    .code { color: #8a8f98; font: 10px/1.3 Inter, ui-sans-serif, system-ui, sans-serif; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 520px; }
    .chip {
      border: 1px solid #2a2d33;
      background: #16171a;
      color: #8a8f98;
      border-radius: 999px;
      padding: 6px 10px;
      font: 12px/1 ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }
    .chip.on { color: #0e0f11; background: #8b7cff; border-color: #8b7cff; }
    .tags, .active { display: flex; gap: 4px; flex-wrap: nowrap; justify-content: flex-end; }
    .active { flex-wrap: wrap; justify-content: flex-start; margin-top: 14px; }
    .tag, .active .chip {
      border: 0;
      border-radius: 4px;
      padding: 2px 6px;
      font: 500 11px/1.4 Inter, ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }
    .muted, .empty { color: #8a8f98; }
    .neg { color: #e36b6b; }
    .right { text-align: right; }
    .empty { margin-top: 18vh; font-size: 28px; }
    @media (max-width: 680px) {
      .split { grid-template-columns: 1fr; }
      .head, li { grid-template-columns: 1fr 1fr; }
      .head button:nth-child(n + 4), li span:nth-child(n + 5) { display: none; }
    }
  </style>
</head>

          li.appendChild(el("span", "right" + (group.qty < 0 ? " neg" : ""), new Intl.NumberFormat("en-US", { maximumFractionDigits: 4 }).format(group.qty).replace("-", "−")));
          li.appendChild(el("span", "right muted", group.price == null ? "—" : formatNum(group.price, group.price >= 100 ? 0 : 2)));
          li.appendChild(el("span", "right" + (group.value < 0 ? " neg" : ""), formatNum(group.value, Math.abs(group.value) >= 100 ? 0 : 2)));
          li.appendChild(tagList(group.items.reduce(function (all, item) {
            (item.row.tags || []).forEach(function (tag) { if (all.indexOf(tag) < 0) all.push(tag); });
            return all;
          }, [])));
          return li;
        }
        li.className = "child";
        name.appendChild(el("span", "sym", (item.row.tags || []).join(" ")));
        li.appendChild(name);
        li.appendChild(el("span", "right" + (item.row.qty < 0 ? " neg" : ""), new Intl.NumberFormat("en-US", { maximumFractionDigits: 4 }).format(item.row.qty).replace("-", "−")));
        li.appendChild(el("span", "right muted", formatNum(item.price, item.price >= 100 ? 0 : 2)));
        li.appendChild(el("span", "right" + (item.value < 0 ? " neg" : ""), formatNum(item.value, Math.abs(item.value) >= 100 ? 0 : 2)));
        li.appendChild(tagList(item.row.tags || []));
        return li;
      }

      function tagList(tags) {
        var host = el("span", "tags");
        tags.forEach(function (tag) {
          var chip = el("button", "tag", tag);
          chip.type = "button";
          paintTag(chip, tag, state.tags.indexOf(tag) >= 0);
          chip.addEventListener("click", function () {
            var at = state.tags.indexOf(tag);
            if (at >= 0) state.tags.splice(at, 1);
            else state.tags.push(tag);
            render();
          });
          host.appendChild(chip);
        });
        return host;
      }

      function render() {
        var app = document.getElementById("app");
        app.textContent = "";
        document.getElementById("tabs").textContent = "";
        if (!state.data) {
          app.appendChild(el("p", "empty", "—"));
          return;
        }
        var latest = latestSnap();
        var rows = rowsFor(state.tab, latest);
        var total = rows.reduce(function (sum, item) { return sum + item.value; }, 0);
        var points = inRange(series(state.tab));
        var hero = el("section", "hero");
        var line = el("div", "total-line");
        line.appendChild(el("p", "total" + (total < 0 ? " neg" : ""), rows.length ? formatNum(total, Math.abs(total) >= 100 || total === 0 ? 0 : 2) : "—"));
        var ccys = el("div", "ccys");
        ["CNY", "HKD", "USD"].forEach(function (id) {
          var button = el("button", "ccy-switch" + (state.tab === id ? " on" : ""), id);
          button.type = "button";
          button.addEventListener("click", function () {
            state.tab = id;
            var known = availableTags();
            state.tags = state.tags.filter(function (tag) { return known.indexOf(tag) >= 0; });
            render();
          });
          ccys.appendChild(button);
        });
        line.appendChild(ccys);
        hero.appendChild(line);
        var ranges = el("div", "ranges");
        RANGES.forEach(function (id) {
          var button = el("button", "range" + (state.range === id ? " on" : ""), id);
          button.type = "button";
          button.addEventListener("click", function () {
            state.range = id;
            render();
          });
          ranges.appendChild(button);
        });
        var pct = change(points);
        ranges.appendChild(el("span", pct > 0 ? "up" : pct < 0 ? "down" : "", formatPct(pct)));
        hero.appendChild(ranges);
        if (state.tags.length) {
          var active = el("div", "active");
          state.tags.forEach(function (tag) {
            var chosen = el("button", "chip", tag + " ×");
            chosen.type = "button";
            paintTag(chosen, tag, true);
            chosen.addEventListener("click", function () {
              state.tags = state.tags.filter(function (item) { return item !== tag; });
              render();
            });
            active.appendChild(chosen);
          });
          hero.appendChild(active);
        }
        app.appendChild(hero);
        var chart = el("section", "chart");
        chart.appendChild(drawChart(points));
        app.appendChild(chart);
        var sheet = el("div", "sheet");
        var head = el("div", "head");
        [["name", "Asset", "left"], ["qty", "Qty", ""], ["price", "Price", ""], ["value", "Value", ""], ["tag", "Tags", ""]].forEach(function (col) {
          var button = el("button", (col[2] ? col[2] + " " : "") + (state.sort === col[0] ? "on" : ""), col[1] + (state.sort === col[0] ? (state.dir < 0 ? " ↓" : " ↑") : ""));
          button.type = "button";
          button.addEventListener("click", function () {
            state.dir = state.sort === col[0] ? -state.dir : (col[0] === "name" || col[0] === "tag" ? 1 : -1);
            state.sort = col[0];
            render();
          });
          head.appendChild(button);
        });
        sheet.appendChild(head);
        app.appendChild(sheet);
        var list = document.createElement("ul");
        var groups = {};
        var order = [];
        rows.slice().sort(function (a, b) {
          var av = sortValue(a, total);
          var bv = sortValue(b, total);
          if (typeof av === "string") return av.localeCompare(bv) * state.dir;
          return (av - bv) * state.dir;
        }).forEach(function (item) {
          var bucket = groups[item.ticker];
          if (!bucket) {
            bucket = { ticker: item.ticker, items: [] };
            groups[item.ticker] = bucket;
            order.push(bucket);
          }
          bucket.items.push(item);
        });
        order.forEach(function (group) {
          group.qty = group.items.reduce(function (sum, item) { return sum + Number(item.row.qty); }, 0);
          group.value = group.items.reduce(function (sum, item) { return sum + item.value; }, 0);
          group.price = group.items.every(function (item) { return item.price === group.items[0].price; }) ? group.items[0].price : null;
          var named = group.items.map(function (item) { return item.row.name; }).filter(Boolean);
          group.name = named.length && named[0] !== group.ticker && named.every(function (name) { return name === named[0]; }) ? named[0] : null;
          list.appendChild(positionRow(group, false));
          if (group.items.length > 1 && state.open[group.ticker]) {
            group.items.forEach(function (item) { list.appendChild(positionRow(group, item)); });
          }
        });
        sheet.appendChild(list);
      }

      try { state.data = decodePortfolio(); } catch (error) { state.data = null; }
      var requested = (new URLSearchParams(location.search).get("tab") || "").toLowerCase();
      var tabFromUrl = { cny: "CNY", hkd: "HKD", usd: "USD" }[requested];
      state.tab = tabFromUrl || "CNY";
      render();
    })();
  </script>
</body>
</html>
